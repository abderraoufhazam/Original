<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إنشاء حساب علامة تجارية — Produit dz ORG</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (function() {
      const isDark = localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) document.documentElement.classList.add("dark");
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6fb;
      --bg-gradient: linear-gradient(135deg, #eef2f9 0%, #f7f9fc 50%, #e8edf5 100%);
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --primary: #16a34a;
      --primary-dark: #15803d;
      --primary-light: #22c55e;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --radius: 14px;
      --radius-lg: 22px;
      --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.22), 0 10px 20px -10px rgba(15, 23, 42, 0.12);
    }

    html.dark {
      --bg: #0a0f1c;
      --bg-gradient: linear-gradient(135deg, #0a0f1c 0%, #131a2c 50%, #0f1729 100%);
      --card-bg: #131a2c;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --border: #1e293b;
      --danger-bg: rgba(220, 38, 38, 0.15);
      --success-bg: rgba(22, 163, 74, 0.15);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
      font-size: 15px; line-height: 1.55;
      color: var(--text); background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 40px 32px 34px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
      animation: cardIn 500ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    html.dark .card { border-color: rgba(255, 255, 255, 0.05); }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #16a34a, #eab308, #dc2626);
      background-size: 200% 100%;
      animation: gradientShift 6s ease infinite;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 16px;
    }

    .lang-btn {
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 160ms;
      color: var(--text-muted);
      font-family: inherit;
    }

    .lang-btn.active {
      background: var(--text);
      color: var(--card-bg);
      border-color: var(--text);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 600;
      transition: color 160ms;
    }

    .back-link:hover { color: var(--primary); }

    .logo-wrap {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-wrap img {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      box-shadow: 0 12px 28px -8px rgba(15, 23, 42, 0.25);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      text-align: center;
      margin: 0 0 8px;
      color: var(--text);
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    form { display: flex; flex-direction: column; gap: 12px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    label .req { color: var(--danger); }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--card-bg);
      transition: all 200ms;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input::placeholder { color: var(--text-light); }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px 22px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      border: 0;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 8px;
      box-shadow: 0 8px 24px -6px rgba(22, 163, 74, 0.5);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -8px rgba(22, 163, 74, 0.65);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg {
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

    .msg.error {
      background: var(--danger-bg);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: var(--danger);
    }

    .msg.success {
      background: var(--success-bg);
      border: 1px solid rgba(22, 163, 74, 0.3);
      color: var(--success);
    }

    .msg.hidden { display: none; }

    .login-link {
      text-align: center;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
    }

    .login-link a {
      color: var(--primary);
      font-weight: 800;
      transition: opacity 160ms;
    }

    .login-link a:hover { opacity: 0.8; }

    .perks {
      margin-top: 22px;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    html.dark .perks { background: rgba(255, 255, 255, 0.03); }

    .perks b { color: var(--text); display: block; margin-bottom: 6px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }

    .perks ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }

    .perks li::before { content: "✓ "; color: var(--primary); font-weight: bold; }

    @media (max-width: 480px) {
      .card { padding: 30px 22px 26px; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>

<main class="page">
  <section class="card">

    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="ar">ع</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <a href="/" class="back-link" data-i18n="backLink">← الرئيسية</a>

    <div class="logo-wrap">
      <img src="/icon.svg" alt="Produit dz ORG">
    </div>

    <h1 data-i18n="title">إنشاء حساب علامة تجارية</h1>
    <p class="subtitle" data-i18n="subtitle">سجّل مجانًا وابدأ بحماية منتجاتك من التقليد.</p>

    <form id="signupForm">
      <div class="field">
        <label for="brand_name" data-i18n="brandNameLabel">اسم العلامة التجارية <span class="req">*</span></label>
        <input id="brand_name" type="text" placeholder="مثال: Rutin Bio" required maxlength="80">
      </div>

      <div class="field">
        <label for="email" data-i18n="emailLabel">البريد الإلكتروني <span class="req">*</span></label>
        <input id="email" type="email" placeholder="email@example.com" required autocomplete="email">
      </div>

      <div class="field">
        <label for="phone" data-i18n="phoneLabel">رقم الهاتف (اختياري)</label>
        <input id="phone" type="tel" placeholder="+213 xxx xxx xxx" autocomplete="tel">
      </div>

      <div class="field">
        <label for="password" data-i18n="passwordLabel">كلمة المرور <span class="req">*</span></label>
        <input id="password" type="password" placeholder="6 أحرف على الأقل" required minlength="6" autocomplete="new-password">
      </div>

      <div class="field">
        <label for="password_confirm" data-i18n="confirmLabel">تأكيد كلمة المرور <span class="req">*</span></label>
        <input id="password_confirm" type="password" placeholder="أعد كتابة كلمة المرور" required minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" id="submitBtn">
        <span>🚀</span>
        <span data-i18n="submitBtn">إنشاء حساب</span>
      </button>
    </form>

    <div id="msg" class="msg hidden"></div>

    <div class="perks">
      <b data-i18n="perksTitle">ما ستحصل عليه:</b>
      <ul>
        <li data-i18n="perk1">لوحة تحكم كاملة لإدارة أكوادك</li>
        <li data-i18n="perk2">تشفير AES-256 لحماية أكوادك</li>
        <li data-i18n="perk3">إحصائيات ورسوم بيانية</li>
        <li data-i18n="perk4">دعم فني مباشر عبر واتساب</li>
      </ul>
    </div>

    <div class="login-link">
      <span data-i18n="alreadyAccount">لديك حساب بالفعل؟</span>
      <a href="/admin.html" data-i18n="loginNow">سجّل الدخول</a>
    </div>

  </section>
</main>

<script>
  // ============================================================
  // SUPABASE
  // ============================================================
  const SUPABASE_URL = "https://qfpmbbntxyrderjlejql.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_O3vqQ2MqwpZYhFRNfFBqFQ_IROe0g_m";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  // ============================================================
  // i18n
  // ============================================================
  const TRANSLATIONS = {
    ar: {
      backLink: "← الرئيسية",
      title: "إنشاء حساب علامة تجارية",
      subtitle: "سجّل مجانًا وابدأ بحماية منتجاتك من التقليد.",
      brandNameLabel: "اسم العلامة التجارية",
      emailLabel: "البريد الإلكتروني",
      phoneLabel: "رقم الهاتف (اختياري)",
      passwordLabel: "كلمة المرور",
      confirmLabel: "تأكيد كلمة المرور",
      submitBtn: "إنشاء حساب",
      perksTitle: "ما ستحصل عليه:",
      perk1: "لوحة تحكم كاملة لإدارة أكوادك",
      perk2: "تشفير AES-256 لحماية أكوادك",
      perk3: "إحصائيات ورسوم بيانية",
      perk4: "دعم فني مباشر عبر واتساب",
      alreadyAccount: "لديك حساب بالفعل؟",
      loginNow: "سجّل الدخول",
      errBrand: "الرجاء إدخال اسم العلامة التجارية.",
      errEmail: "الرجاء إدخال بريد إلكتروني صالح.",
      errPhone: "رقم الهاتف غير صالح.",
      errPassword: "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
      errPasswordMatch: "كلمتا المرور غير متطابقتين.",
      errExists: "هذا البريد مستعمل بالفعل. جرّب تسجيل الدخول.",
      errGeneric: "حدث خطأ. الرجاء المحاولة مجددًا.",
      successMsg: "✓ تم إنشاء الحساب بنجاح! جارٍ التحويل...",
      creating: "جارٍ الإنشاء..."
    },
    fr: {
      backLink: "← Accueil",
      title: "Créer un compte marque",
      subtitle: "Inscrivez-vous gratuitement et protégez vos produits.",
      brandNameLabel: "Nom de la marque",
      emailLabel: "Adresse e-mail",
      phoneLabel: "Téléphone (optionnel)",
      passwordLabel: "Mot de passe",
      confirmLabel: "Confirmer le mot de passe",
      submitBtn: "Créer un compte",
      perksTitle: "Ce que vous obtiendrez :",
      perk1: "Tableau de bord complet",
      perk2: "Chiffrement AES-256",
      perk3: "Statistiques et graphiques",
      perk4: "Support WhatsApp direct",
      alreadyAccount: "Vous avez déjà un compte ?",
      loginNow: "Se connecter",
      errBrand: "Veuillez saisir le nom de la marque.",
      errEmail: "Veuillez saisir un email valide.",
      errPhone: "Numéro de téléphone invalide.",
      errPassword: "Le mot de passe doit faire au moins 6 caractères.",
      errPasswordMatch: "Les mots de passe ne correspondent pas.",
      errExists: "Cet email est déjà utilisé. Connectez-vous.",
      errGeneric: "Une erreur est survenue. Réessayez.",
      successMsg: "✓ Compte créé avec succès ! Redirection...",
      creating: "Création..."
    },
    en: {
      backLink: "← Home",
      title: "Create a brand account",
      subtitle: "Sign up for free and protect your products.",
      brandNameLabel: "Brand name",
      emailLabel: "Email",
      phoneLabel: "Phone (optional)",
      passwordLabel: "Password",
      confirmLabel: "Confirm password",
      submitBtn: "Create account",
      perksTitle: "What you'll get:",
      perk1: "Full dashboard",
      perk2: "AES-256 encryption",
      perk3: "Statistics and charts",
      perk4: "Direct WhatsApp support",
      alreadyAccount: "Already have an account?",
      loginNow: "Sign in",
      errBrand: "Please enter the brand name.",
      errEmail: "Please enter a valid email.",
      errPhone: "Invalid phone number.",
      errPassword: "Password must be at least 6 characters.",
      errPasswordMatch: "Passwords do not match.",
      errExists: "This email is already registered. Try logging in.",
      errGeneric: "An error occurred. Please try again.",
      successMsg: "✓ Account created successfully! Redirecting...",
      creating: "Creating..."
    }
  };

  let currentLang = localStorage.getItem("lang") || "ar";
  if (!localStorage.getItem("lang")) {
    const bl = (navigator.language || "ar").toLowerCase().slice(0, 2);
    currentLang = bl === "fr" ? "fr" : bl === "en" ? "en" : "ar";
  }

  function t(key) {
    return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) ||
           (TRANSLATIONS.ar[key]) || key;
  }

  function applyTranslations() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });

    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

    document.querySelectorAll(".lang-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === currentLang);
    });

    document.title = currentLang === "ar"
      ? "إنشاء حساب علامة تجارية — Produit dz ORG"
      : currentLang === "fr"
        ? "Créer un compte — Produit dz ORG"
        : "Create account — Produit dz ORG";
  }

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem("lang", currentLang);
      applyTranslations();
    });
  });

  applyTranslations();

  // ============================================================
  // MESSAGE UI
  // ============================================================
  function showMsg(text, type) {
    const el = $("msg");
    el.className = "msg " + type;
    el.textContent = text;
    el.classList.remove("hidden");
  }

  function hideMsg() {
    $("msg").classList.add("hidden");
  }

  // ============================================================
  // SIGN UP
  // ============================================================
  $("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg();

    const brandName = $("brand_name").value.trim();
    const email = $("email").value.trim().toLowerCase();
    const phone = $("phone").value.trim();
    const password = $("password").value;
    const passwordConfirm = $("password_confirm").value;

    // Validation
    if (!brandName || brandName.length < 2) {
      return showMsg(t("errBrand"), "error");
    }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return showMsg(t("errEmail"), "error");
    }
    if (phone && !/^[\+\d\s\-\(\)]{6,20}$/.test(phone)) {
      return showMsg(t("errPhone"), "error");
    }
    if (!password || password.length < 6) {
      return showMsg(t("errPassword"), "error");
    }
    if (password !== passwordConfirm) {
      return showMsg(t("errPasswordMatch"), "error");
    }

    const btn = $("submitBtn");
    btn.disabled = true;
    btn.innerHTML = `<span>⏳</span><span>${t("creating")}</span>`;

    try {
      const { data, error } = await sb.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            role: "brand",
            brand_name: brandName,
            phone: phone || null
          }
        }
      });

      if (error) {
        if (error.message.toLowerCase().includes("already") ||
            error.message.toLowerCase().includes("registered")) {
          showMsg(t("errExists"), "error");
        } else {
          showMsg(error.message, "error");
        }
        btn.disabled = false;
        btn.innerHTML = `<span>🚀</span><span>${t("submitBtn")}</span>`;
        return;
      }

      // Insert brand message automatiquement (premier contact)
      try {
        await sb.from("brand_messages").insert({
          user_id: data.user.id,
          brand_name: brandName,
          email: email,
          phone: phone || null,
          subject: "Nouvelle inscription",
          message: "Bonjour, je viens de créer mon compte marque. Merci de m'accompagner dans la configuration."
        });
      } catch (msgErr) {
        console.warn("Message auto non envoyé:", msgErr);
      }

      // Afficher message de succès et rediriger vers contact
      showMsg(t("successMsg"), "success");
      btn.innerHTML = `<span>✓</span><span>${t("submitBtn")}</span>`;

      setTimeout(() => {
        window.location.href = "/brand";
      }, 1800);

    } catch (err) {
      console.error(err);
      showMsg(t("errGeneric"), "error");
      btn.disabled = false;
      btn.innerHTML = `<span>🚀</span><span>${t("submitBtn")}</span>`;
    }
  });
</script>

<script src="/bot-guard.js"></script>
</body>
</html>
