<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تواصل معنا — Original</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <script>
    (function() {
      const isDark = localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) document.documentElement.classList.add("dark");
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6fb;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --primary: #16a34a;
      --primary-light: #22c55e;
      --whatsapp: #25D366;
      --whatsapp-dark: #128C7E;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --radius: 14px;
      --radius-lg: 22px;
      --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.22);
    }

    html.dark {
      --bg: #0a0f1c;
      --card-bg: #131a2c;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --border: #1e293b;
      --danger-bg: rgba(220, 38, 38, 0.15);
      --success-bg: rgba(22, 163, 74, 0.15);
    }

    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
      font-size: 15px; line-height: 1.55;
      color: var(--text); background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 40px 32px 34px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #16a34a, #eab308, #dc2626);
    }

    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 16px;
    }

    .lang-btn {
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      color: var(--text-muted);
      font-family: inherit;
    }

    .lang-btn.active {
      background: var(--text);
      color: var(--card-bg);
      border-color: var(--text);
    }

    .logo-wrap { text-align: center; margin-bottom: 18px; }
    .logo-wrap img {
      width: 70px; height: 70px; border-radius: 18px;
      box-shadow: 0 12px 28px -8px rgba(15, 23, 42, 0.25);
    }

    .welcome-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--success-bg);
      border: 1px solid rgba(22, 163, 74, 0.3);
      color: var(--success);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
      margin: 0 auto 16px;
      width: fit-content;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      text-align: center;
      margin: 0 0 8px;
      color: var(--text);
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    .whatsapp-cta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));
      color: #fff;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px -6px rgba(37, 211, 102, 0.5);
      margin-bottom: 24px;
      cursor: pointer;
    }

    .whatsapp-cta svg {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      padding: 8px;
    }

    .whatsapp-cta-text { flex: 1; min-width: 0; }
    .whatsapp-cta-title { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
    .whatsapp-cta-sub { font-size: 12px; opacity: 0.9; }
    .whatsapp-cta-arrow { font-size: 20px; flex-shrink: 0; }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-light);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    form { display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.hidden { display: none; }

    label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    label .req { color: var(--danger); }

    input, textarea {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--card-bg);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      resize: vertical;
    }

    textarea { min-height: 100px; }

    input::placeholder, textarea::placeholder { color: var(--text-light); }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }

    .turnstile-wrap {
      display: flex;
      justify-content: center;
      margin: 8px 0;
      min-height: 65px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px 22px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      border: 0;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 8px 24px -6px rgba(22, 163, 74, 0.5);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

    .msg.error {
      background: var(--danger-bg);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: var(--danger);
    }

    .msg.success {
      background: var(--success-bg);
      border: 1px solid rgba(22, 163, 74, 0.3);
      color: var(--success);
    }

    .msg.hidden { display: none; }

    .info-box {
      margin-top: 22px;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
      text-align: center;
    }

    .info-box b { color: var(--text); }

    .admin-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .admin-link a {
      color: var(--primary);
      font-weight: 800;
    }

    @media (max-width: 480px) {
      .card { padding: 30px 22px 26px; }
      h1 { font-size: 21px; }
      .whatsapp-cta { padding: 14px; }
    }
  </style>
</head>
<body>

      <svg viewBox="0 0 24 24" fill="#fff">

      <div class="whatsapp-cta-text">

      <div class="whatsapp-cta-arrow">→</div>
    </a>

    <div class="or-divider" data-i18n="orDivider">أو</div>

    <!-- Message Form -->
    <form id="contactForm">

      <!-- 👤 حقل الاسم (للزوار فقط) -->
      <div class="field hidden" id="nameField">
        <label for="senderName" data-i18n="nameLabel">👤 اسمك <span class="req">*</span></label>
        <input id="senderName" type="text" placeholder="مثال: أحمد بن علي" maxlength="100">

      <div class="field">

<script src="/supabase-client.js"></script>
<script>
  const EMAILJS_PUBLIC_KEY = "juoh_rOKaec16kxrH";
  const EMAILJS_SERVICE_ID = "service_42s5mbn";
  const EMAILJS_TEMPLATE_ID = "template_4kdo3so";

  if (typeof emailjs !== "undefined") {
    emailjs.init(EMAILJS_PUBLIC_KEY);
  }

  const $ = id => document.getElementById(id);

  let currentUser = null;
  let userMeta = {};

  const TRANSLATIONS = {
    ar: {
      welcomeBadge: "مرحبًا بك",
      title: "تواصل معنا",
      subtitle: "اختر الطريقة المناسبة للتواصل. سنرد عليك في أسرع وقت.",
      whatsappTitle: "واتساب الأعمال",
      whatsappSub: "+213 556 339 415",
      orDivider: "أو",
      nameLabel: "👤 اسمك",
      subjectLabel: "الموضوع",
      messageLabel: "رسالتك",
      submitBtn: "إرسال الرسالة",
      sending: "جارٍ الإرسال...",
      errName: "الرجاء إدخال اسمك (حرفين على الأقل).",
      errSubject: "الرجاء إدخال موضوع الرسالة.",
      errMessage: "الرجاء إدخال الرسالة (10 أحرف على الأقل).",
      errTurnstile: "⚠️ الرجاء إكمال التحقق من الأمان.",
      errGeneric: "حدث خطأ. الرجاء المحاولة مجددًا.",
      successMsg: "✓ تم إرسال رسالتك بنجاح! سنرد عليك قريبًا.",
      infoTitle: "📬 كيف تصلك رسالتك؟",
      infoText: "ستصل رسالتك مباشرة إلى فريقنا. سنرد عليك في أقرب وقت.",
      adminText: "هل أنت الأدمن؟",
      adminLink: "دخول"
    },
    fr: {
      welcomeBadge: "Bienvenue",
      title: "Contactez-nous",
      subtitle: "Choisissez le moyen de contact. Nous vous répondrons rapidement.",
      whatsappTitle: "WhatsApp Business",
      whatsappSub: "+213 556 339 415",
      orDivider: "OU",
      nameLabel: "👤 Votre nom",
      subjectLabel: "Sujet",
      messageLabel: "Votre message",
      submitBtn: "Envoyer le message",
      sending: "Envoi...",
      errName: "Veuillez saisir votre nom (min 2 caractères).",
      errSubject: "Veuillez saisir un sujet.",
      errMessage: "Veuillez saisir un message (10 caractères min).",
      errTurnstile: "⚠️ Veuillez compléter la vérification de sécurité.",
      errGeneric: "Une erreur est survenue. Réessayez.",
      successMsg: "✓ Message envoyé avec succès !",
      infoTitle: "📬 Comment ça marche ?",
      infoText: "Votre message arrive directement à notre équipe.",
      adminText: "Vous êtes admin ?",
      adminLink: "Connexion"
    },
    en: {
      welcomeBadge: "Welcome",
      title: "Contact us",
      subtitle: "Choose how to reach us. We'll respond quickly.",
      whatsappTitle: "WhatsApp Business",
      whatsappSub: "+213 556 339 415",
      orDivider: "OR",
      nameLabel: "👤 Your name",
      subjectLabel: "Subject",
      messageLabel: "Your message",
      submitBtn: "Send message",
      sending: "Sending...",
      errName: "Please enter your name (min 2 characters).",
      errSubject: "Please enter a subject.",
      errMessage: "Please enter a message (min 10 characters).",
      errTurnstile: "⚠️ Please complete the security verification.",
      errGeneric: "An error occurred. Please try again.",
      successMsg: "✓ Message sent successfully!",
      infoTitle: "📬 How it works",
      infoText: "Your message goes directly to our team.",
      adminText: "Are you admin?",
      adminLink: "Login"
    }
  };

  let currentLang = localStorage.getItem("lang") || "ar";
  if (!localStorage.getItem("lang")) {
    const bl = (navigator.language || "ar").toLowerCase().slice(0, 2);
    currentLang = bl === "fr" ? "fr" : bl === "en" ? "en" : "ar";
  }

  function t(key) {
    return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) ||
           (TRANSLATIONS.ar[key]) || key;
  }

  function applyTranslations() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });

    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

    document.querySelectorAll(".lang-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === currentLang);
    });

    document.title = currentLang === "ar"
      ? "تواصل معنا — Original"
      : currentLang === "fr"
        ? "Contactez-nous — Original"
        : "Contact us — Original";
  }

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem("lang", currentLang);
      applyTranslations();
    });
  });

  applyTranslations();

  function showMsg(text, type) {
    const el = $("msg");
    el.className = "msg " + type;
    el.textContent = text;
    el.classList.remove("hidden");
  }
  function hideMsg() { $("msg").classList.add("hidden"); }

  // ✅ الصفحة متاحة للجميع — بدون توجيه
  async function checkSession() {
    try {
      const { data: { session } } = await sb.auth.getSession();

      if (session) {
        currentUser = session.user;
        userMeta = session.user.user_metadata || {};
        // مستخدم مسجل — إخفاء حقل الاسم
        const nf = $("nameField");
        if (nf) nf.classList.add("hidden");
      } else {
        currentUser = null;
        userMeta = {};
        // زائر — إظهار حقل الاسم
        const nf = $("nameField");
        if (nf) nf.classList.remove("hidden");
      }
    } catch (e) {
      console.warn("checkSession error:", e);
      // في حالة الخطأ — نتعامل معه كزائر
      currentUser = null;
      userMeta = {};
      const nf = $("nameField");
      if (nf) nf.classList.remove("hidden");
    }
  }

  checkSession();

  $("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg();

    // ─── اسم المُرسِل ───
    let senderName;
    if (currentUser) {
      senderName = userMeta.brand_name || currentUser.email || "—";
    } else {
      const nameInput = $("senderName");
      senderName = (nameInput?.value || "").trim();
      if (!senderName || senderName.length < 2) {
        return showMsg(t("errName"), "error");
      }
    }

    const subject = $("subject").value.trim();
    const message = $("message").value.trim();

    if (!subject || subject.length < 3) {
      return showMsg(t("errSubject"), "error");
    }
    if (!message || message.length < 10) {
      return showMsg(t("errMessage"), "error");
    }

    // 🔒 التحقق من Turnstile
    const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value || '';
    if (!turnstileToken) {
      return showMsg(t("errTurnstile"), "error");
    }

    const btn = $("submitBtn");
    btn.disabled = true;
    btn.innerHTML = `<span>⏳</span><span>${t("sending")}</span>`;

    try {
      // 1. حفظ في Supabase (فقط إذا كان مسجّلًا)
      if (currentUser) {
        try {
          const { error } = await sb.from("brand_messages").insert({
            user_id: currentUser.id,
            brand_name: userMeta.brand_name || "—",
            email: currentUser.email,
            phone: userMeta.phone || null,
            subject: subject,
            message: message
          });
          if (error) console.warn("Supabase insert error:", error);
        } catch (e) {
          console.warn("Insert error:", e);
        }
      }

      // 2. إشعار واتساب للأدمن (دائمًا)
      try {
        fetch("/api/submit?type=message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            brand_name: senderName,
            email: currentUser ? currentUser.email : "guest@originaldz.online",
            phone: currentUser ? (userMeta.phone || null) : null,
            subject: subject,
            message: message,
            turnstile_token: turnstileToken
          })
        }).catch(err => console.warn("Notify error:", err));
      } catch (e) {
        console.warn("Notify setup error:", e);
      }

      // 3. إشعار EmailJS للأدمن (دائمًا)
      try {
        const emailParams = {
          brand_name: senderName,
          email: currentUser ? currentUser.email : "guest@originaldz.online",
          phone: currentUser ? (userMeta.phone || "—") : "—",
          subject: subject,
          message: message,
          to_email: "mepirf@gmail.com"
        };
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, emailParams);
        console.log("✅ Email notification sent");
      } catch (emailErr) {
        console.warn("⚠️ Email notification failed:", emailErr);
      }

      // ─── نجاح ───
      showMsg(t("successMsg"), "success");
      $("subject").value = "";
      $("message").value = "";
      const nameInput = $("senderName");
      if (nameInput && !currentUser) nameInput.value = "";

      btn.innerHTML = `<span>✓</span><span>${t("submitBtn")}</span>`;
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<span>📨</span><span>${t("submitBtn")}</span>`;
      }, 2500);

    } catch (err) {
      console.error(err);
      showMsg(t("errGeneric"), "error");
      btn.disabled = false;
      btn.innerHTML = `<span>📨</span><span>${t("submitBtn")}</span>`;
    }
  });
</script>

<script src="/bot-guard.js"></script>
</body>
</html>
