<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORDIZ — خريطة منتجاتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071422; --card:#0E2134; --card2:#122A41; --line:rgba(255,255,255,.10);
  --txt:#EAF2FB; --txt2:#9DB2C6; --txt3:#6E8399; --green:#45C98A; --red:#F5A3A3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);min-height:100vh;
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:20px 22px 40px}

.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:19px;margin:0}
.head p{margin:2px 0 0;font-size:12.5px;color:var(--txt2)}
.head .grow{flex:1}
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--txt2);font:inherit;font-size:13px;font-weight:700;
  padding:8px 16px;border-radius:999px;cursor:pointer;transition:.16s}
.tabs button.on{color:#fff}
.tabs button.on[data-tab="verif"]{background:#0B6BC0}
.tabs button.on[data-tab="reports"]{background:#A81C22}

.filters{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:999px}
.filters button{border:0;background:transparent;color:var(--txt2);font:inherit;font-size:12.5px;font-weight:700;
  padding:8px 13px;border-radius:999px;cursor:pointer}
.filters button.on{background:#1D7BD0;color:#fff}
.zoombar{display:flex;gap:6px}
.zoombar button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:16px;cursor:pointer}

.grid{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
.mapbox{position:relative;background:#DDE9F4;border:1px solid var(--line);border-radius:22px;
  overflow:hidden;height:min(76vh,680px)}
#dzMap{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#dzMap.dragging{cursor:grabbing}
#dzMap path{stroke:#0F1B26;stroke-width:1.7;transition:fill .18s,stroke .18s;cursor:pointer}
#dzMap path:hover{stroke:#fff;stroke-width:2.6}
#dzMap path.sel{stroke:#fff;stroke-width:3.4}
.wlabel{fill:#0B1B2B;stroke:rgba(255,255,255,.75);stroke-width:7;paint-order:stroke;
  font-weight:700;opacity:.8;pointer-events:none}

.tip{position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .12s;
  background:rgba(6,18,32,.97);border:1px solid rgba(255,255,255,.2);border-radius:12px;
  padding:9px 12px;font-size:12.5px;white-space:nowrap;box-shadow:0 18px 40px -18px #000}
.tip.show{opacity:1}
.tip b{display:block;font-size:13px;margin-bottom:2px}

.legend{position:absolute;bottom:14px;left:14px;background:rgba(255,255,255,.94);
  border:1px solid rgba(11,27,43,.12);border-radius:14px;padding:10px 12px;color:#0B1B2B}
.legend .row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.legend .sw{width:28px;height:14px;border-radius:4px;border:1px solid rgba(11,27,43,.12)}
.legend .lb{font-size:11px;min-width:56px;font-weight:600}
.legend .head{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5A6E82;margin-bottom:7px;font-weight:700}

.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;
  position:sticky;top:20px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.panel__head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.panel__body{padding:14px 18px;overflow:auto}
.empty{color:var(--txt3);font-size:13.5px;text-align:center;padding:56px 14px;line-height:1.95}
h2{font-size:18px;margin:0}
.sub{font-size:12px;color:var(--txt2);margin:3px 0 0}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.kpi span{display:block;font-size:10.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:19px}
.sec-t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin:14px 0 8px}
.bar-row{display:flex;align-items:center;gap:9px;font-size:12.5px;margin-bottom:7px}
.bar-row .nm{min-width:96px;color:var(--txt2)}
.bar-row .track{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#1D7BD0,#45C98A)}
.bar-row b{font-size:12px;color:var(--txt2);min-width:44px;text-align:left}
.note{margin-top:14px;font-size:11px;color:var(--txt3);text-align:center}

/* داخل لوحة الماركة (iframe) */
body.embed .head h1, body.embed .head p { display: none; }
body.embed .wrap { padding-top: 6px; }
body.embed .note { display: none; }

/* اتجاه زمني */
.spark{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:6px;min-height:56px}
.spark svg{display:block;width:100%;height:auto}
.spark .cap{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-top:4px}

/* بطاقات البلاغات */
.rep{display:flex;gap:11px;padding:10px;border-radius:14px;background:var(--card2);
  border:1px solid var(--line);cursor:pointer;margin-bottom:8px;transition:.16s;
  text-align:start;width:100%;font:inherit;color:inherit}
.rep:hover{border-color:#E05A5A;transform:translateY(-1px)}
.rep .thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:#0A1725}
.rep .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rep .m{min-width:0;flex:1}
.rep .m b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep .m span{display:block;font-size:11.5px;color:var(--txt2);margin-top:2px}
.st{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;margin-top:5px;
  background:rgba(240,138,138,.16);color:#F5A3A3;border:1px solid rgba(240,138,138,.35)}
.back{border:0;background:var(--card2);color:var(--txt2);font:inherit;font-size:12.5px;
  padding:7px 12px;border-radius:10px;cursor:pointer;margin-bottom:12px;border:1px solid var(--line)}
.back:hover{color:#fff;border-color:#E05A5A}
.big-img{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0A1725;cursor:zoom-in}
.big-img img{display:block;width:100%;height:auto}
.fields{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.f{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.f span{color:var(--txt2)}
.f b{font-weight:600;text-align:left;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;
  font-size:12.5px;color:var(--txt2);line-height:1.8;margin-top:10px}

/* عارض الصورة */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(4,12,22,.92);display:none;
  align-items:center;justify-content:center;padding:24px}
.lightbox.on{display:flex}
.lightbox .lb-img{max-width:min(900px,92vw);max-height:86vh;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.18);background:#0A1725}
.lightbox .lb-img img{display:block;max-width:100%;max-height:86vh;width:auto;height:auto}
.lb-close{position:absolute;top:18px;left:18px;width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);color:#fff;
  font-size:18px;cursor:pointer;display:grid;place-items:center}
.lb-close:hover{background:rgba(255,255,255,.22);border-color:#fff}
.state{display:none;padding:8px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;
  background:rgba(240,138,138,.12);border:1px solid rgba(240,138,138,.3);color:#F5A3A3}
.state.on{display:block}
@media (max-width:980px){.grid{grid-template-columns:1fr}.panel{position:static;max-height:none}.mapbox{height:56vh}}
</style>
</head>

    <div>
      <h1>خريطة منتجاتي</h1>

      <button data-f="year">سنة</button>

<script>
const NAMES = {"01":"أدرار","02":"الشلف","03":"الأغواط","04":"أم البواقي","05":"باتنة","06":"بجاية","07":"بسكرة","08":"بشار","09":"البليدة","10":"البويرة","11":"تمنراست","12":"تبسة","13":"تلمسان","14":"تيارت","15":"تيزي وزو","16":"الجزائر","17":"الجلفة","18":"جيجل","19":"سطيف","20":"سعيدة","21":"سكيكدة","22":"سيدي بلعباس","23":"عنابة","24":"قالمة","25":"قسنطينة","26":"المدية","27":"مستغانم","28":"المسيلة","29":"معسكر","30":"ورقلة","31":"وهران","32":"البيض","33":"إليزي","34":"برج بوعريريج","35":"بومرداس","36":"الطارف","37":"تندوف","38":"تيسمسيلت","39":"الوادي","40":"خنشلة","41":"سوق أهراس","42":"تيبازة","43":"ميلة","44":"عين الدفلى","45":"النعامة","46":"عين تموشنت","47":"غرداية","48":"غليزان","49":"تيميمون","50":"برج باجي مختار","51":"أولاد جلال","52":"بني عباس","53":"عين صالح","54":"عين قزام","55":"توقرت","56":"جانت","57":"المغير","58":"المنيعة","59":"أفلو","60":"بريكة","61":"القنطرة","62":"بئر العاتر","63":"العريشة","64":"قصر الشلالة","65":"عين وسارة","66":"مسعد","67":"قصر البخاري","68":"بوسعادة","69":"الأبيض سيدي الشيخ","59":"آفلو","60":"بريكة","61":"القنطرة","62":"بئر العاتر","63":"العريشة","64":"قصر الشلالة","65":"عين وسارة","66":"مسعد","67":"قصر البخاري","68":"بوسعادة","69":"الأبيض سيدي الشيخ"};
const RAMP_V = ["#F2FBFF","#BFE6FA","#7BC9F0","#2E9BE0","#0B6BC0"];
const RAMP_R = ["#FFF5F5","#FFD0D0","#FF9A9A","#E64C4C","#A81C22"];
const DAYS = { today: 1, week: 7, month: 30, year: 365 };

let tab = "verif";
let filter = "month";
let STATS = {};
let selected = null;
let RANGE = { from: null, to: null };

const MAP = document.getElementById("dzMap");
const LAYER = document.getElementById("zoomLayer");
const TIP = document.getElementById("tip");
const HEAD = document.getElementById("pHead");
const BODY = document.getElementById("pBody");
const PATHS = Array.prototype.slice.call(MAP.querySelectorAll("path")).filter(function (p) { return p.id; });

function setState(msg) {
  const el = document.getElementById("state");
  if (!msg) { el.classList.remove("on"); el.textContent = ""; return; }
  el.textContent = msg; el.classList.add("on");
}

function valOf(code) {
  const r = STATS[code] || {};
  return tab === "verif" ? Number(r.verifications || 0) : Number(r.reports || 0);
}

function thresholds() {
  const vals = Object.keys(NAMES).map(valOf).filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
  if (!vals.length) return [1, 2, 3, 4];
  const max = vals[vals.length - 1];
  const th = [0.10, 0.25, 0.5, 0.75].map(function (f) { return Math.max(1, Math.round(max * f)); });
  for (let i = 1; i < 4; i++) th[i] = Math.max(th[i], th[i - 1] + 1);
  return th;
}

function paint() {
  const th = thresholds();
  const rmp = tab === "verif" ? RAMP_V : RAMP_R;
  PATHS.forEach(function (p) {
    const v = valOf(p.id);
    let b = -1;
    if (v > 0) {
      b = v <= th[0] ? 0 : v <= th[1] ? 1 : v <= th[2] ? 2 : v <= th[3] ? 3 : 4;
    }
    p.style.fill = b < 0 ? "#1B3448" : rmp[b];
  });
  drawLegend(th, rmp);
}

function drawLegend(th, rmp) {
  const labels = ["1 – " + th[0], (th[0] + 1) + " – " + th[1], (th[1] + 1) + " – " + th[2], (th[2] + 1) + " – " + th[3]];
  let html = '<div class="head">' + (tab === "verif" ? "عدد التحققات" : "عدد البلاغات") + '</div>';
  for (let i = 0; i < 4; i++) {
    html += '<div class="row"><span class="sw" style="background:' + rmp[i] + '"></span><span class="lb">' + labels[i] + '</span></div>';
  }
  html += '<div class="row"><span class="sw" style="background:' + rmp[4] + '"></span><span class="lb">أكثر من ' + th[3] + '</span></div>';
  html += '<div class="row" style="margin-top:2px"><span class="sw" style="background:#1B3448"></span><span class="lb">لا بيانات</span></div>';
  document.getElementById("legend").innerHTML = html;
}

function addLabels() {
  if (document.getElementById("wlabels")) return;
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("id", "wlabels");
  PATHS.forEach(function (p) {
    let b; try { b = p.getBBox(); } catch (e) { return; }
    if (!b || !b.width) return;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", b.x + b.width / 2);
    t.setAttribute("y", b.y + b.height / 2 + 26);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", "68");
    t.setAttribute("class", "wlabel");
    t.textContent = p.id;
    g.appendChild(t);
  });
  LAYER.appendChild(g);
}

function showTip(e, code) {
  const v = valOf(code);
  TIP.innerHTML = "<b>" + (NAMES[code] || code) + "</b>" + v.toLocaleString("fr-FR") +
    (tab === "verif" ? " تحقق" : " بلاغ");
  TIP.classList.add("show");
  TIP.style.left = Math.min(e.clientX + 14, window.innerWidth - 190) + "px";
  TIP.style.top = (e.clientY + 16) + "px";
}

function openPanel(code) {
  const r = STATS[code] || {};
  const name = NAMES[code] || code;
  const total = Number(r.verifications || 0);
  const orig = Number(r.v_original || 0);
  const used = Number(r.v_used || 0);
  const notf = Number(r.v_notfound || 0);
  const reps = Number(r.reports || 0);

  HEAD.style.display = "block";
  HEAD.innerHTML = '<h2>' + name + '</h2>' +
    '<p class="sub">ولاية رقم ' + code + ' · ' + document.querySelector("#filters .on").textContent + '</p>' +
    '<div class="big" style="margin-top:8px;color:' + (tab === "verif" ? "#2E9BE0" : "#F5A3A3") + '">' +
    (tab === "verif" ? total : reps).toLocaleString("fr-FR") + '</div>' +
    '<div style="font-size:11.5px;color:var(--txt2)">' + (tab === "verif" ? "تحقق" : "بلاغ") + '</div>';

  if (tab === "verif") {
    BODY.innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><span>أصلي</span><b style="color:#7FE3B4">' + orig + '</b></div>' +
        '<div class="kpi"><span>مستعمل</span><b style="color:#F3CB8A">' + used + '</b></div>' +
        '<div class="kpi"><span>غير موجود</span><b style="color:#F5A3A3">' + notf + '</b></div>' +
        '<div class="kpi"><span>نسبة النجاح</span><b>' + (total ? Math.round(orig / total * 100) : 0) + '%</b></div>' +
      '</div>' +
      '<div class="sec-t">الاتجاه الزمني</div>' +
      '<div class="spark" id="sparkBox"></div>' +
      '<div class="sec-t">النِسب</div>' +
      bar("أصلي", orig, total) + bar("مستعمل", used, total) + bar("غير موجود", notf, total);
    loadTrend(code);
  } else {
    BODY.innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><span>بلاغات</span><b style="color:#F5A3A3">' + reps + '</b></div>' +
        '<div class="kpi"><span>نسبة البلاغات</span><b>' + (total ? ((reps / total) * 100).toFixed(1) : "0.0") + '%</b></div>' +
      '</div>' +
      '<div class="sec-t">الاتجاه الزمني</div>' +
      '<div class="spark" id="sparkBox"></div>' +
      '<div class="sec-t">البلاغات — اضغط للتفاصيل</div>' +
      '<div id="repList"><div class="empty" style="padding:24px">جارٍ التحميل…</div></div>';
    loadTrend(code);
    loadReports(code);
  }
}

/* ── الاتجاه الزمني ── */
function fmtDay(s) {
  const p = String(s).split("-");
  return p.length === 3 ? (p[2] + "/" + p[1]) : String(s);
}

function sparkSVG(rows, key, color) {
  const vals = rows.map(function (r) { return Number(r[key] || 0); });
  const max = Math.max.apply(null, vals.concat([1]));
  const W = 300, H = 64;
  const step = vals.length > 1 ? W / (vals.length - 1) : W;
  const pts = vals.map(function (v, i) {
    return [i * step, H - (v / max) * (H - 10) - 5];
  });
  const line = pts.map(function (p, i) {
    return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1);
  }).join(" ");
  const area = line + " L" + W + " " + H + " L0 " + H + " Z";
  const gid = "sp" + Math.random().toString(36).slice(2, 8);

  return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + color + '" stop-opacity=".42"/>' +
    '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.2" ' +
    'stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

async function loadTrend(code) {
  const box = document.getElementById("sparkBox");
  if (!box) return;

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;

    const res = await fetch("/api/batch-manager?action=trend", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ code: code, from: RANGE.from, to: RANGE.to })
    });
    const json = await res.json();

    if (!res.ok || json.status !== "OK" || !json.rows || !json.rows.length) {
      box.style.display = "none";
      return;
    }

    const key = tab === "verif" ? "verifications" : "reports";
    const color = tab === "verif" ? "#2E9BE0" : "#E05A5A";
    const total = json.rows.reduce(function (s, r) { return s + Number(r[key] || 0); }, 0);

    box.innerHTML = sparkSVG(json.rows, key, color) +
      '<div class="cap"><span>' + fmtDay(json.rows[0].day) + '</span>' +
      '<span>الإجمالي: ' + total + '</span>' +
      '<span>' + fmtDay(json.rows[json.rows.length - 1].day) + '</span></div>';
  } catch (e) {
    box.style.display = "none";
  }
}

function bar(label, v, max) {
  const pct = max ? Math.round((v / max) * 100) : 0;
  return '<div class="bar-row"><span class="nm">' + label + '</span>' +
    '<span class="track"><span class="fill" style="width:' + pct + '%"></span></span>' +
    '<b>' + v + '</b></div>';
}

/* ── صور البلاغات ── */
function placeholderImg() {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">' +
    '<rect width="320" height="200" fill="#0A1725"/>' +
    '<rect x="120" y="56" width="80" height="44" rx="8" fill="#1B3448"/>' +
    '<circle cx="146" cy="72" r="7" fill="#2E9BE0"/>' +
    '<path d="M126 92l22-20 18 16 14-12 20 16z" fill="#24405C"/>' +
    '<text x="160" y="132" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#6E8399">لا صورة</text></svg>';
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function imgSrc(v) {
  if (!v || typeof v !== "string") return placeholderImg();
  const s = v.trim();
  if (/^https?:\/\//i.test(s) || s.indexOf("data:") === 0) return s;
  if (s.charAt(0) === "/") return s;
  return s;
}

function fmtDate(v) {
  try { return new Date(v).toLocaleDateString("fr-DZ", { day: "2-digit", month: "2-digit", year: "numeric" }); }
  catch (e) { return "—"; }
}

async function loadReports(code) {
  const box = document.getElementById("repList");
  if (!box) return;

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { box.innerHTML = '<div class="empty" style="padding:24px">سجّل الدخول أولاً.</div>'; return; }

    const res = await fetch("/api/batch-manager?action=reports", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ code: code, from: RANGE.from, to: RANGE.to })
    });
    const json = await res.json();

    if (!res.ok || json.status !== "OK") {
      box.innerHTML = '<div class="empty" style="padding:24px">تعذّر تحميل البلاغات.</div>';
      return;
    }

    const rows = json.rows || [];
    if (!rows.length) {
      box.innerHTML = '<div class="empty" style="padding:24px">لا بلاغات في هذه الفترة.</div>';
      return;
    }

    box.innerHTML = rows.map(function (r, i) {
      const title = r.product_name || r.attempted_code || "بلاغ #" + r.id;
      const sub = (r.product_brand || "—") + " · " + fmtDate(r.created_at);
      return '<button class="rep" data-i="' + i + '">' +
        '<span class="thumb"><img alt="" src="' + imgSrc(r.product_image) + '"></span>' +
        '<span class="m"><b>' + esc(title) + '</b>' +
        '<span>' + esc(sub) + '</span>' +
        '<span class="st">' + esc(r.status || "جديد") + '</span></span></button>';
    }).join("");

    box.querySelectorAll(".rep").forEach(function (btn) {
      btn.addEventListener("click", function () { openReport(rows[Number(btn.dataset.i)], code); });
    });
  } catch (e) {
    box.innerHTML = '<div class="empty" style="padding:24px">خطأ في التحميل.</div>';
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c];
  });
}

function openReport(r, code) {
  HEAD.style.display = "none";
  const title = r.product_name || r.attempted_code || "بلاغ #" + r.id;
  const src = imgSrc(r.product_image);

  BODY.innerHTML =
    '<button class="back" id="backBtn">← رجوع إلى البلاغات</button>' +
    '<div class="big-img" id="bigImg"><img alt="" src="' + src + '"></div>' +
    '<h2 style="font-size:16px;margin:14px 0 2px">' + esc(title) + '</h2>' +
    '<p class="sub" style="margin-bottom:10px">' + esc(r.status || "—") + ' · ' + fmtDate(r.created_at) + '</p>' +
    '<div class="fields">' +
      '<div class="f"><span>العلامة</span><b>' + esc(r.product_brand || "—") + '</b></div>' +
      '<div class="f"><span>الكود المُبلَّغ عنه</span><b>' + esc(r.attempted_code || "—") + '</b></div>' +
      '<div class="f"><span>الولاية</span><b>' + esc(NAMES[code] || code) + '</b></div>' +
      '<div class="f"><span>رقم البلاغ</span><b>#' + esc(r.id) + '</b></div>' +
      '<div class="f"><span>الحالة</span><b>' + esc(r.status || "—") + '</b></div>' +
    '</div>' +
    (r.comment ? '<div class="sec-t">تعليق المُبلِّغ</div><div class="comment">' + esc(r.comment) + '</div>' : '');

  document.getElementById("backBtn").onclick = function () { openPanel(code); };

  const big = document.getElementById("bigImg");
  big.addEventListener("click", function () {
    document.getElementById("lbImg").innerHTML = '<img alt="" src="' + src + '">';
    document.getElementById("lightbox").classList.add("on");
  });
}

function select(code) {
  PATHS.forEach(function (x) { x.classList.toggle("sel", x.id === code); });
  selected = code;
  openPanel(code);
}

async function load() {
  const days = DAYS[filter];
  const to = new Date(); to.setHours(23, 59, 59, 999);
  const from = new Date(to.getTime() - days * 86400000);
  RANGE = { from: from.toISOString(), to: to.toISOString() };

  setState("");
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { setState("يجب تسجيل الدخول أولاً."); return; }

    const res = await fetch("/api/batch-manager?action=stats", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token },
      body: JSON.stringify({ from: from.toISOString(), to: to.toISOString() })
    });
    const json = await res.json();

    if (!res.ok || json.status !== "OK") {
      setState("تعذّر تحميل البيانات: " + (json.message || res.status));
      return;
    }

    STATS = {};
    (json.rows || []).forEach(function (r) { STATS[r.code] = r; });
    paint();
    if (selected) openPanel(selected);
  } catch (e) {
    setState("خطأ: " + e.message);
  }
}

PATHS.forEach(function (p) {
  p.addEventListener("mouseenter", function (e) { showTip(e, p.id); });

});

document.querySelectorAll("#tabs button").forEach(function (b) {

let scale = 1, tx = 0, ty = 0, drag = false, sx = 0, sy = 0, moved = false, downX = 0, downY = 0;
const pointers = new Map();
let pinch = null;

function apply() { LAYER.setAttribute("transform", "translate(" + tx + " " + ty + ") scale(" + scale + ")"); }

function vbPoint(clientX, clientY) {
  const r = MAP.getBoundingClientRect();
  return {
    x: (clientX - r.left) / r.width * 10000,
    y: (clientY - r.top) / r.height * 9999
  };
}
function zoomAt(f, cx, cy) {
  const ns = Math.min(14, Math.max(1, scale * f));
  const k = ns / scale;
  tx = cx - k * (cx - tx); ty = cy - k * (cy - ty); scale = ns; apply();
}
function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy) || 1;
}
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

MAP.addEventListener("wheel", function (e) {
  e.preventDefault();
  const p = vbPoint(e.clientX, e.clientY);
  zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, p.x, p.y);
}, { passive: false });

MAP.addEventListener("pointerdown", function (e) {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  MAP.classList.add("dragging");

  if (pointers.size === 2) {
    // ── بدء التكبير بإصبعين ──
    const pts = Array.from(pointers.values());
    const m = mid(pts[0], pts[1]);
    const v = vbPoint(m.x, m.y);
    pinch = {
      d0: dist(pts[0], pts[1]),
      s0: scale,
      /** النقطة داخل المحتوى التي نُثبّتها تحت الإصبعين */
      cx: (v.x - tx) / scale,
      cy: (v.y - ty) / scale
    };
    drag = false;
    moved = true;            // لا نعتبرها نقرة
    return;
  }

  drag = true; moved = false;
  sx = e.clientX; sy = e.clientY;
  downX = e.clientX; downY = e.clientY;
});

MAP.addEventListener("pointermove", function (e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  // ── تكبير/تصغير بإصبعين ──
  if (pinch && pointers.size >= 2) {
    const pts = Array.from(pointers.values());
    const d = dist(pts[0], pts[1]);
    const m = mid(pts[0], pts[1]);
    const v = vbPoint(m.x, m.y);
    const ns = Math.min(14, Math.max(1, pinch.s0 * (d / pinch.d0)));
    tx = v.x - pinch.cx * ns;
    ty = v.y - pinch.cy * ns;
    scale = ns;
    apply();
    return;
  }

  if (!drag) return;
  if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) moved = true;
  if (!moved) return;
  const r = MAP.getBoundingClientRect();
  tx += (e.clientX - sx) / r.width * 10000;
  ty += (e.clientY - sy) / r.height * 9999;
  sx = e.clientX; sy = e.clientY; apply();
});

function endPointer(e) {
  pointers.delete(e.pointerId);

  if (pointers.size < 2) pinch = null;

  if (pointers.size === 1) {
    // التحوّل من إصبعين إلى إصبع: نبدأ السحب من جديد بلا نقرة
    const p = Array.from(pointers.values())[0];
    drag = true; moved = true;
    sx = p.x; sy = p.y;
    downX = p.x; downY = p.y;
    return;
  }

  if (pointers.size === 0) {
    drag = false;
    MAP.classList.remove("dragging");
  }
}

MAP.addEventListener("pointerup", endPointer);
MAP.addEventListener("pointercancel", endPointer);
MAP.addEventListener("pointerleave", function (e) {
  if (pointers.has(e.pointerId)) endPointer(e);
});
document.getElementById("zin").onclick = function () { zoomAt(1.35, 5000, 5000); };
document.getElementById("zout").onclick = function () { zoomAt(1 / 1.35, 5000, 5000); };
document.getElementById("zreset").onclick = function () { scale = 1; tx = 0; ty = 0; apply(); };
