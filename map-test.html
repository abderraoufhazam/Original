<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORDIZ — اختبار إحصاءات الولايات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#071422;--card:#0E2134;--card2:#122A41;--line:rgba(255,255,255,.10);
        --txt:#EAF2FB;--txt2:#9DB2C6;--acc:#2E9BE0;--green:#45C98A;--red:#E05A5A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);min-height:100vh;
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,Tahoma,sans-serif;padding:24px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--txt2);font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  button{border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;
    font-size:13px;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer}
  button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi span{display:block;font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em}
  .kpi b{font-size:22px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line)}
  th{color:var(--txt2);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  td b{color:var(--green)}
  .muted{color:var(--txt2);font-size:12.5px}
  pre{background:#0A1725;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-size:11.5px;overflow:auto;max-height:260px;color:#9DB2C6;direction:ltr;text-align:left}
  .err{color:#F5A3A3}
</style>
</head>
<body>
<div class="wrap">
  <h1>اختبار إحصاءات الولايات</h1>
  <p class="sub">يستدعي <code>/api/batch-manager?action=stats</code> بتوكن جلستك — الأرقام حقيقية من قاعدة بياناتك.</p>

  <div class="bar" id="filters">
    <button data-f="today">اليوم</button>
    <button data-f="week">آخر 7 أيام</button>
    <button class="on" data-f="month">آخر 30 يوم</button>
    <button data-f="year">آخر سنة</button>
    <button id="reload">↻ إعادة</button>
  </div>

  <div class="box" id="summary"><span class="muted">جارٍ التحميل…</span></div>
  <div class="box" id="tableBox" style="display:none"></div>
  <div class="box"><div class="muted" style="margin-bottom:8px">الاستجابة الخام</div><pre id="raw">—</pre></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js"></script>
<script>
const $ = id => document.getElementById(id);
const DAYS = { today: 1, week: 7, month: 30, year: 365 };
let filter = "month";

function range() {
  const to = new Date();
  to.setHours(23, 59, 59, 999);
  const from = new Date(to.getTime() - DAYS[filter] * 86400000);
  return { from: from.toISOString(), to: to.toISOString() };
}

async function load() {
  $("summary").innerHTML = '<span class="muted">جارٍ التحميل…</span>';
  $("tableBox").style.display = "none";
  $("raw").textContent = "—";

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      $("summary").innerHTML = '<span class="err">غير مسجّل الدخول — افتح /login أولاً.</span>';
      return;
    }

    const r = range();
    const res = await fetch("/api/batch-manager?action=stats", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify(r)
    });

    const json = await res.json();
    $("raw").textContent = JSON.stringify(json, null, 2).slice(0, 4000);

    if (!res.ok || json.status !== "OK") {
      $("summary").innerHTML = '<span class="err">فشل: ' + (json.message || res.status) + '</span>';
      return;
    }

    const rows = json.rows || [];
    const tv = rows.reduce((s, x) => s + Number(x.verifications || 0), 0);
    const tr = rows.reduce((s, x) => s + Number(x.reports || 0), 0);
    const active = rows.filter(x => Number(x.verifications || 0) > 0 || Number(x.reports || 0) > 0).length;

    $("summary").innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><span>التحققات</span><b>' + tv.toLocaleString("fr-FR") + '</b></div>' +
        '<div class="kpi"><span>البلاغات</span><b style="color:#F5A3A3">' + tr + '</b></div>' +
        '<div class="kpi"><span>ولايات بها بيانات</span><b>' + active + ' / ' + rows.length + '</b></div>' +
      '</div>';

    const nz = rows.filter(x => Number(x.verifications || 0) > 0 || Number(x.reports || 0) > 0)
                   .sort((a, b) => Number(b.verifications) - Number(a.verifications));

    if (nz.length) {
      $("tableBox").style.display = "block";
      $("tableBox").innerHTML =
        '<table><thead><tr><th>الولاية</th><th>تحققات</th><th>أصلي</th><th>مستعمل</th><th>غير موجود</th><th>بلاغات</th></tr></thead><tbody>' +
        nz.map(x =>
          '<tr><td>' + x.code + '</td>' +
          '<td><b>' + Number(x.verifications).toLocaleString("fr-FR") + '</b></td>' +
          '<td>' + Number(x.v_original) + '</td>' +
          '<td>' + Number(x.v_used) + '</td>' +
          '<td>' + Number(x.v_notfound) + '</td>' +
          '<td style="color:#F5A3A3">' + Number(x.reports) + '</td></tr>'
        ).join("") + '</tbody></table>';
    }
  } catch (e) {
    $("summary").innerHTML = '<span class="err">خطأ: ' + e.message + '</span>';
  }
}

document.querySelectorAll("#filters button[data-f]").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#filters button[data-f]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    filter = b.dataset.f;
    load();
  });
});
$("reload").addEventListener("click", load);

load();
</script>
</body>
</html>
