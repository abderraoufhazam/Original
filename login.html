<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="description" content="دخول العلامات التجارية إلى لوحة تحكم ORDIZ.">
  <link rel="canonical" href="https://www.ordiz.online/login">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>دخول — ORDIZ</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0060C0">
  <link rel="icon" type="image/svg+xml" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-client.js"></script>
  <script>
    (function() {
      const isDark = localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) document.documentElement.classList.add("dark");
    })();
  </script>
</head>
<body>

<main class="page">
  <section class="card">
    <button class="dark-toggle" id="darkToggle" aria-label="Mode sombre">🌙</button>

    <div class="brand">ORDIZ</div>
    <img src="/icon.png" alt="" class="app-logo">
    <h1 id="loginTitle">تسجيل الدخول</h1>
    <p class="muted" id="loginSub">أدخل بياناتك للوصول إلى حسابك.</p>

    <div id="roleBadge" class="hidden" style="text-align:center;margin-bottom:16px;padding:8px 16px;background:#f0fdf4;border:1px solid #45C98A;border-radius:100px;font-size:12px;font-weight:800;color:#166534;display:inline-block;">
    </div>

    <!-- تبديل طريقة الدخول -->
    <div style="display:flex;gap:6px;margin:0 0 16px;background:var(--bg-alt);padding:4px;border-radius:100px;">
      <button type="button" id="modeEmail" style="flex:1;border:0;background:#fff;border-radius:100px;padding:9px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;color:var(--text);">بالبريد</button>
      <button type="button" id="modeBrand" style="flex:1;border:0;background:transparent;border-radius:100px;padding:9px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;color:var(--text-muted);">باسم العلامة</button>
    </div>

    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
      <input id="brandName" type="text" placeholder="اسم العلامة التجارية" autocomplete="username" maxlength="80" style="margin-top:10px;display:none">
      <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" style="margin-top:10px" required>
      <button id="loginBtn" type="submit">دخول</button>
    </form>

    <div id="loginMsg" class="result danger hidden" style="margin-top:15px"></div>

    <p class="small" style="margin-top:20px">
      ليس لديك حساب؟
      <a href="/signup" style="color:#16A96B;font-weight:800">سجّل الآن</a>
    </p>

    <p class="small" style="margin-top:10px;font-size:11px;color:#94a3b8">
      <a href="/" style="color:inherit">← العودة للرئيسية</a>
    </p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

function showMsg(text, type = "danger") {
  const el = $("loginMsg");
  el.className = "result " + type;
  el.innerHTML = `<p style="margin:0">${text}</p>`;
  el.classList.remove("hidden");
}

// ✅ استدعاء السيرفر: isAdmin + role
async function getAuthInfo(token) {
  try {
    const res = await fetch("/api/check-admin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: token })
    });
    const data = await res.json();
    return data; // { isAdmin, role, user_id, email, ... }
  } catch (e) {
    console.warn("check-admin error:", e);
    return { isAdmin: false, role: null };
  }
}

// ✅ توجيه حسب الدور
function routeByRole(authInfo) {
  if (authInfo.isAdmin) return "/admin.html";
  if (authInfo.role === "shop") return "/";
  return "/brand";
}

// ✅ قراءة ?role= من الرابط لتخصيص الواجهة
(function customizeByQuery() {
  const params = new URLSearchParams(location.search);
  const qrole = params.get("role");
  const badge = $("roleBadge");

  if (false) {
    $("loginTitle").textContent = "دخول صاحب محل";
    $("loginSub").textContent = "أدخل بياناتك للوصول إلى لوحة متابعة المحل.";
    badge.innerHTML = "🏪 حساب محل";
    badge.classList.remove("hidden");
  } else if (qrole === "brand") {
    $("loginTitle").textContent = "دخول صاحب علامة تجارية";
    $("loginSub").textContent = "أدخل بياناتك للوصول إلى لوحة تحكم علامتك.";
    badge.innerHTML = "🏢 حساب ماركة";
    badge.classList.remove("hidden");
  }
})();

// إذا كان المستخدم مسجّل دخول بالفعل → وجّهه
async function checkExistingSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const authInfo = await getAuthInfo(session.access_token);
  if (authInfo.status === "OK") {
    window.location.href = routeByRole(authInfo);
  }
}

checkExistingSession();

// ── تبديل طريقة الدخول: بالبريد / باسم العلامة ──
let loginMode = "email";

function setMode(mode) {
  loginMode = mode;
  const isBrand = mode === "brand";

  $("email").style.display = isBrand ? "none" : "";
  $("email").required = !isBrand;
  $("brandName").style.display = isBrand ? "" : "none";
  $("brandName").required = isBrand;

  $("modeEmail").style.background = isBrand ? "transparent" : "#fff";
  $("modeEmail").style.color = isBrand ? "var(--text-muted)" : "var(--text)";
  $("modeBrand").style.background = isBrand ? "#fff" : "transparent";
  $("modeBrand").style.color = isBrand ? "var(--text)" : "var(--text-muted)";

  $("loginMsg").classList.add("hidden");
}

$("modeEmail").addEventListener("click", () => setMode("email"));
$("modeBrand").addEventListener("click", () => setMode("brand"));

// ── إكمال الدخول بعد الحصول على الجلسة ──
async function finishLogin(accessToken, btn) {
  const authInfo = await getAuthInfo(accessToken);

  if (authInfo.status !== "OK") {
    btn.disabled = false;
    btn.textContent = "دخول";
    showMsg("تعذّر التحقق من الحساب. حاول مجددًا.");
    return;
  }

  window.location.href = routeByRole(authInfo);
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = $("password").value;
  const btn = $("loginBtn");

  btn.disabled = true;
  btn.textContent = "جارٍ الدخول...";

  // ═══════ الدخول باسم العلامة (عبر السيرفر) ═══════
  if (loginMode === "brand") {
    const brandName = $("brandName").value.trim();

    if (!brandName || !password) {
      btn.disabled = false;
      btn.textContent = "دخول";
      showMsg("الرجاء إدخال اسم العلامة وكلمة المرور.");
      return;
    }

    try {
      const res = await fetch("/api/submit?type=brand-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ brand_name: brandName, password })
      });

      const data = await res.json();

      if (!res.ok || data.status !== "OK" || !data.session) {
        btn.disabled = false;
        btn.textContent = "دخول";
        showMsg(data.message || "اسم العلامة أو كلمة المرور غير صحيحة.");
        return;
      }

      const { error: sessErr } = await sb.auth.setSession({
        access_token: data.session.access_token,
        refresh_token: data.session.refresh_token
      });

      if (sessErr) {
        btn.disabled = false;
        btn.textContent = "دخول";
        showMsg("تعذّر إنشاء الجلسة. حاول مجددًا.");
        return;
      }

      await finishLogin(data.session.access_token, btn);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "دخول";
      showMsg("تعذّر الاتصال بالخادم.");
    }
    return;
  }

  // ═══════ الدخول بالبريد (بالطريقة الأصلية) ═══════
  const email = $("email").value.trim();

  if (!email || !password) {
    btn.disabled = false;
    btn.textContent = "دخول";
    showMsg("الرجاء إدخال البريد وكلمة المرور.");
    return;
  }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    btn.disabled = false;
    btn.textContent = "دخول";
    showMsg(error.message || "فشل تسجيل الدخول.");
    return;
  }

  await finishLogin(data.session.access_token, btn);
});

// Dark mode
const darkToggle = $("darkToggle");
function updateDarkIcon() {
  const isDark = document.documentElement.classList.contains("dark");
  if (darkToggle) darkToggle.textContent = isDark ? "☀️" : "🌙";
}
if (darkToggle) {
  darkToggle.addEventListener("click", () => {
    const isDark = document.documentElement.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateDarkIcon();
  });
}
updateDarkIcon();
</script>

<script src="/bot-guard.js"></script>
</body>
</html>
