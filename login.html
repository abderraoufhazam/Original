<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>دخول — Original</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const isDark = localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) document.documentElement.classList.add("dark");
    })();
  </script>
</head>
<body>

<main class="page">
  <section class="card">
    <button class="dark-toggle" id="darkToggle" aria-label="Mode sombre">🌙</button>

    <div class="brand">Original</div>
    <img src="/icon.png" alt="" class="app-logo">
    <h1>تسجيل الدخول</h1>
    <p class="muted">أدخل بياناتك للوصول إلى حسابك.</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
      <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" style="margin-top:10px" required>
      <button id="loginBtn" type="submit">دخول</button>
    </form>

    <div id="loginMsg" class="result danger hidden" style="margin-top:15px"></div>

    <p class="small" style="margin-top:20px">
      ليس لديك حساب؟
      <a href="/signup" style="color:#16a34a;font-weight:800">سجّل كعلامة تجارية</a>
    </p>

    <p class="small" style="margin-top:10px;font-size:11px;color:#94a3b8">
      <a href="/" style="color:inherit">← العودة للرئيسية</a>
    </p>
  </section>
</main>

<script>
const SUPABASE_URL = "https://qfpmbbntxyrderjlejql.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_O3vqQ2MqwpZYhFRNfFBqFQ_IROe0g_m";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);

function showMsg(text, type = "danger") {
  const el = $("loginMsg");
  el.className = "result " + type;
  el.innerHTML = `<p style="margin:0">${text}</p>`;
  el.classList.remove("hidden");
}

// ✅ استدعاء السيرفر للتحقق من صلاحية الأدمن
async function checkAdminServer(token) {
  try {
    const res = await fetch("/api/check-admin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: token })
    });
    const data = await res.json();
    return data.isAdmin === true;
  } catch (e) {
    console.warn("check-admin error:", e);
    return false;
  }
}

// إذا كان المستخدم مسجّل دخول بالفعل → وجّهه حسب دوره
async function checkExistingSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const isAdmin = await checkAdminServer(session.access_token);
  window.location.href = isAdmin ? "/admin.html" : "/brand";
}

checkExistingSession();

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;
  const btn = $("loginBtn");

  if (!email || !password) {
    showMsg("الرجاء إدخال البريد وكلمة المرور.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "جارٍ الدخول...";

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    btn.disabled = false;
    btn.textContent = "دخول";
    showMsg(error.message || "فشل تسجيل الدخول.");
    return;
  }

  // ✅ اسأل السيرفر: هل هذا أدمن؟
  const isAdmin = await checkAdminServer(data.session.access_token);
  window.location.href = isAdmin ? "/admin.html" : "/brand";
});

const darkToggle = $("darkToggle");
function updateDarkIcon() {
  const isDark = document.documentElement.classList.contains("dark");
  if (darkToggle) darkToggle.textContent = isDark ? "☀️" : "🌙";
}
if (darkToggle) {
  darkToggle.addEventListener("click", () => {
    const isDark = document.documentElement.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateDarkIcon();
  });
}
updateDarkIcon();
</script>

<script src="/bot-guard.js"></script>
</body>
</html>
