<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dzGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow -->
  <circle cx="256" cy="240" r="200" fill="#16a34a" opacity="0.08"/>

  <!-- Algerian flag accent stripes (top) -->
  <rect x="0" y="0" width="512" height="8" fill="#16a34a" opacity="0.9"/>
  <rect x="0" y="8" width="256" height="4" fill="#ffffff" opacity="0.7"/>
  <rect x="256" y="8" width="256" height="4" fill="#dc2626" opacity="0.7"/>

  <!-- Shield -->
  <path d="M256 70 L420 128 L420 270 C420 366 344 434 256 462 C168 434 92 366 92 270 L92 128 Z"
        fill="url(#shieldGrad)"
        stroke="#16a34a" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner shield border -->
  <path d="M256 92 L400 142 L400 268 C400 350 336 410 256 436 C176 410 112 350 112 268 L112 142 Z"
        fill="none" stroke="#0f172a" stroke-width="2" opacity="0.15"/>

  <!-- QR pattern inside shield -->
  <g fill="#0f172a">
    <!-- Top-left finder -->
    <rect x="145" y="150" width="60" height="60" rx="6" fill="none" stroke="#0f172a" stroke-width="10"/>
    <rect x="163" y="168" width="24" height="24" rx="2"/>

    <!-- Top-right finder -->
    <rect x="307" y="150" width="60" height="60" rx="6" fill="none" stroke="#0f172a" stroke-width="10"/>
    <rect x="325" y="168" width="24" height="24" rx="2"/>

    <!-- Data modules row 1 -->
    <rect x="145" y="230" width="14" height="14"/>
    <rect x="175" y="230" width="14" height="14"/>
    <rect x="205" y="230" width="14" height="14"/>
    <rect x="235" y="230" width="14" height="14"/>
    <rect x="265" y="230" width="14" height="14"/>
    <rect x="295" y="230" width="14" height="14"/>
    <rect x="325" y="230" width="14" height="14"/>
    <rect x="353" y="230" width="14" height="14"/>

    <!-- Data modules row 2 -->
    <rect x="160" y="260" width="14" height="14"/>
    <rect x="190" y="260" width="14" height="14"/>
    <rect x="220" y="260" width="14" height="14"/>
    <rect x="250" y="260" width="14" height="14"/>
    <rect x="280" y="260" width="14" height="14"/>
    <rect x="310" y="260" width="14" height="14"/>
    <rect x="340" y="260" width="14" height="14"/>

    <!-- Data modules row 3 -->
    <rect x="145" y="290" width="14" height="14"/>
    <rect x="175" y="290" width="14" height="14"/>
    <rect x="235" y="290" width="14" height="14"/>
    <rect x="265" y="290" width="14" height="14"/>
    <rect x="325" y="290" width="14" height="14"/>
    <rect x="353" y="290" width="14" height="14"/>

    <!-- Data modules row 4 -->
    <rect x="160" y="320" width="14" height="14"/>
    <rect x="190" y="320" width="14" height="14"/>
    <rect x="220" y="320" width="14" height="14"/>
    <rect x="280" y="320" width="14" height="14"/>
    <rect x="310" y="320" width="14" height="14"/>
    <rect x="340" y="320" width="14" height="14"/>

    <!-- Data modules row 5 -->
    <rect x="145" y="350" width="14" height="14"/>
    <rect x="205" y="350" width="14" height="14"/>
    <rect x="265" y="350" width="14" height="14"/>
    <rect x="295" y="350" width="14" height="14"/>
    <rect x="353" y="350" width="14" height="14"/>
  </g>

  <!-- "dz" badge at bottom right -->
  <g>
    <circle cx="382" cy="382" r="70" fill="url(#dzGrad)" stroke="#ffffff" stroke-width="10"/>
    <text x="382" y="402"
          font-family="Arial, Helvetica, sans-serif"
          font-size="58"
          font-weight="900"
          fill="#ffffff"
          text-anchor="middle"
          letter-spacing="-2">dz</text>
  </g>

  <!-- Checkmark on top of dz badge -->
  <g>
    <circle cx="378" cy="330" r="34" fill="#16a34a" stroke="#ffffff" stroke-width="6"/>
    <path d="M362 330 L374 342 L394 320"
          fill="none" stroke="#ffffff" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small text "ORG" at bottom left -->
  <text x="130" y="440"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="900"
        fill="#16a34a"
        text-anchor="middle"
        letter-spacing="3">ORG</text>
</svg>
