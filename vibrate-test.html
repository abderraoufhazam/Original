<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>اختبار الاهتزاز</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 0;
    }
    h1 { font-size: 22px; margin: 0; }
    .info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
      max-width: 320px;
      line-height: 1.6;
    }
    button {
      width: 100%;
      max-width: 320px;
      padding: 18px 24px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: transform 200ms;
    }
    button:active { transform: scale(0.96); }
    .b1 { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .b2 { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .b3 { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .b4 { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #1e293b;
      font-size: 13px;
      color: #94a3b8;
      max-width: 320px;
      width: 100%;
    }
    .result .ok { color: #22c55e; font-weight: 800; }
    .result .no { color: #ef4444; font-weight: 800; }
  </style>
</head>
<body>
  <h1>📳 اختبار الاهتزاز</h1>
  <p class="info">
    اضغط على أي زر لاختبار الاهتزاز.
    إذا لم تهتز، افتح إعدادات الجوال وتأكد أن الاهتزاز مفعّل.
  </p>

  <button class="b1" onclick="test(100, '100ms خفيف')">اهتزاز 100ms</button>
  <button class="b2" onclick="test([100, 80, 100], 'مزدوج')">اهتزاز مزدوج</button>
  <button class="b3" onclick="test([200, 100, 200, 100, 200], 'قوي')">اهتزاز قوي</button>
  <button class="b4" onclick="test(500, '500ms طويل')">اهتزاز 500ms</button>

  <div class="result" id="result">جاهز للاختبار...</div>

  <script>
    function test(pattern, label) {
      const result = document.getElementById("result");

      if (!("vibrate" in navigator)) {
        result.innerHTML = "❌ <span class='no'>جوالك أو متصفحك لا يدعم الاهتزاز</span>";
        return;
      }

      try {
        const ok = navigator.vibrate(pattern);
        if (ok) {
          result.innerHTML = `✅ <span class='ok'>تم إرسال: ${label}</span><br>هل شعرت بالاهتزاز؟`;
        } else {
          result.innerHTML = "⚠️ <span class='no'>المتصفح رفض الطلب — تأكد من إعدادات الجوال</span>";
        }
      } catch (e) {
        result.innerHTML = "❌ <span class='no'>خطأ: " + e.message + "</span>";
      }
    }
  </script>
</body>
</html>
